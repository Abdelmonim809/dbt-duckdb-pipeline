models:
  - name: job_posting
    description: clean postings
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: unique id for the job posting
      - name: job_title
        description: title of the job posting
        data_tests:
          - not_null
      - name: company_name
        description: name of the company posting the job
      - name: job_location
        description: location of the job posting
      - name: job_via
        description: posting location as scraped
      - name: job_schedule_type
        description: schedule as posted
      - name: job_work_from_home
        description: whether the job is remote or not
      - name: search_date
        description: date the job was posted
      - name: search_term
        description: search term used to find the job posting

  - name: jobs_per_month
    description: number of jobs posted per month
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: month of the job posting
      - name: role
        description: role of the job posting
      - name: postings
        description: number of jobs posted in that month


  - name: top_locations
    description: top locations for job postings
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_location
        description: location of the job posting
      - name: postings
        description: number of jobs posted in that location

  - name : monthly_summary
    description: summary of job postings per month
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: searching by month
        data_tests:
          - unique
          - not_null
      - name: total_postings
        description: total number of jobs posted in that month
      - name: remote_postings
        description: number of remote jobs posted by month
      - name: pct_remote
        description: percentage of remote jobs posted by month